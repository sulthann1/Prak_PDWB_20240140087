<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Goodang Bouldering - Member Registration</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            goodang: {
              yellow: '#facc15', 
              yellowHover: '#eab308',
              black: '#09090b',  
              dark: '#18181b',   
              gear: '#27272a',   
              text: '#f4f4f5'    
            }
          },
          fontFamily: { 
            sans: ['Inter', 'sans-serif'], 
            display: ['Oswald', 'sans-serif'] 
          },
          boxShadow: {
            'solid': '6px 6px 0px 0px rgba(9,9,11,1)',
            'solid-yellow': '4px 4px 0px 0px #facc15',
            'card-shadow': '0 25px 50px -12px rgba(0, 0, 0, 0.75)',
          }
        }
      }
    }
  </script>

  <style>
    body { background-color: #f4f4f5; }
    
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #e4e4e7; }
    ::-webkit-scrollbar-thumb { background: #a1a1aa; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #71717a; }

    input[type="file"] { display: none; }
    .file-upload-btn {
      display: inline-flex; align-items: center; justify-content: center;
      padding: 0.5rem 1rem; border: 2px dashed #d4d4d8; border-radius: 0.25rem;
      background: #fafafa; color: #71717a; cursor: pointer; transition: all 0.2s;
      font-family: 'Inter', sans-serif; font-weight: 600;
    }
    .file-upload-btn:hover { border-color: #facc15; color: #09090b; background: #fefce8; }

    .grip-texture {
      background-image: url("data:image/svg+xml,%3Csvg width='20' height='20' viewBox='0 0 20 20' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%23ffffff' fill-opacity='0.03' fill-rule='evenodd'%3E%3Ccircle cx='3' cy='3' r='1'/%3E%3Ccircle cx='13' cy='13' r='1'/%3E%3C/g%3E%3C/svg%3E");
    }
  </style>
</head>
<body class="font-sans text-goodang-black min-h-screen antialiased">

<header class="bg-goodang-black shadow-md border-b-4 border-goodang-yellow sticky top-0 z-50">
  <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
    <div class="flex items-center gap-4">
      
      <div class="w-12 h-12 bg-goodang-yellow flex items-center justify-center transform -skew-x-12 rounded-sm border-2 border-white">
        <svg class="w-8 h-8 text-goodang-black transform skew-x-12" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"></path>
        </svg>
      </div>
      <div>
        <h1 class="font-display font-bold text-2xl text-white leading-none tracking-wide uppercase">Goodang <span class="text-goodang-yellow">Bouldering</span></h1>
        <p class="text-[0.7rem] font-bold text-zinc-400 uppercase tracking-[0.2em] mt-0.5">Climber Registration</p>
      </div>
    </div>
  </div>
</header>

<main class="max-w-7xl mx-auto px-4 py-10 grid gap-10 lg:grid-cols-12">
  
  <!-- LEFT: Form Section -->
  <section class="lg:col-span-5">
    <div class="bg-white rounded-sm shadow-solid border-2 border-goodang-black p-8 relative overflow-hidden">
      <!-- Accent Tape di ujung form -->
      <div class="absolute -top-4 -right-4 w-16 h-8 bg-zinc-200 rotate-45 border-2 border-zinc-300 opacity-50"></div>

      <div class="mb-8 border-b-2 border-zinc-100 pb-4 relative z-10">
        <h2 class="font-display font-bold text-3xl text-goodang-black uppercase tracking-wide">Gear <span class="text-goodang-yellow">Tag</span></h2>
        <p class="text-sm text-zinc-500 font-medium">Lengkapi form untuk mencetak ID Tag Climbing Anda.</p>
      </div>

      <form id="registration-form" class="space-y-5 relative z-10">
        <!-- Foto Upload -->
        <div class="flex items-center gap-5 p-4 bg-zinc-50 border-2 border-zinc-200 rounded-sm">
          <div id="photo-preview" class="w-20 h-20 bg-zinc-200 border-2 border-goodang-black flex items-center justify-center flex-shrink-0 transform -skew-x-3 overflow-hidden shadow-inner relative">
            <svg class="w-8 h-8 text-zinc-400 transform skew-x-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path></svg>
          </div>
          <div class="flex-1">
            <label class="block text-[0.7rem] font-bold text-zinc-800 uppercase tracking-widest mb-2">Foto Climber <span class="text-red-500">*</span></label>
            <label for="inp-foto" class="file-upload-btn w-full text-sm">Upload Foto</label>
            <input id="inp-foto" type="file" accept="image/png, image/jpeg, image/jpg" />
          </div>
        </div>

        <div>
          <label class="block text-[0.7rem] font-bold text-zinc-800 uppercase tracking-widest mb-1.5">Nama Lengkap</label>
          <input id="inp-nama" name="nama" type="text" class="w-full border-2 border-zinc-300 rounded-sm py-2.5 px-4 text-sm font-medium focus:border-goodang-black focus:ring-0 outline-none transition-all" placeholder="Misal: Adam Ondra" required/>
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-[0.7rem] font-bold text-zinc-800 uppercase tracking-widest mb-1.5">No. Identitas / KTP</label>
            <input id="inp-nim" name="nim" type="text" class="w-full border-2 border-zinc-300 rounded-sm py-2.5 px-4 text-sm font-medium focus:border-goodang-black focus:ring-0 outline-none transition-all" placeholder="ID Number" required/>
          </div>
          <div>
            <label class="block text-[0.7rem] font-bold text-zinc-800 uppercase tracking-widest mb-1.5">Gender</label>
            <select id="inp-jk" name="jenisKelamin" class="w-full border-2 border-zinc-300 rounded-sm py-2.5 px-4 text-sm font-medium focus:border-goodang-black outline-none bg-white transition-all cursor-pointer" required>
              <option value="">Pilih...</option>
              <option value="Laki-laki">Laki-laki</option>
              <option value="Perempuan">Perempuan</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-[0.7rem] font-bold text-zinc-800 uppercase tracking-widest mb-1.5">Kategori</label>
            <input id="inp-jurusan" name="jurusan" type="text" class="w-full border-2 border-zinc-300 rounded-sm py-2.5 px-4 text-sm font-medium focus:border-goodang-black outline-none transition-all" placeholder="Misal: Boulder Bro" required/>
          </div>
          <div>
            <label class="block text-[0.7rem] font-bold text-zinc-800 uppercase tracking-widest mb-1.5">Membership Plan</label>
            <select id="inp-warna" name="tipe" class="w-full border-2 border-zinc-300 rounded-sm py-2.5 px-4 text-sm font-medium focus:border-goodang-black outline-none bg-white transition-all cursor-pointer" required>
              <option value="">Pilih Visit Plan</option>
              <option value="DayPass">Day Pass</option>
              <option value="Monthly">Monthly Climber</option>
              <option value="Annual">Annual Pro</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-[0.7rem] font-bold text-zinc-800 uppercase tracking-widest mb-1.5">Tanggal Lahir</label>
            <input id="inp-tgl" name="tanggalLahir" type="date" class="w-full border-2 border-zinc-300 rounded-sm py-2.5 px-4 text-sm font-medium focus:border-goodang-black outline-none transition-all" required/>
          </div>
          <div>
            <label class="block text-[0.7rem] font-bold text-zinc-800 uppercase tracking-widest mb-1.5">Tanggal Daftar</label>
            <input id="inp-daftar" name="tanggalDaftar" type="date" class="w-full border-2 border-zinc-300 rounded-sm py-2.5 px-4 text-sm font-medium bg-zinc-100 text-zinc-500 outline-none cursor-not-allowed" readonly/>
          </div>
        </div>

        <div class="pt-6 flex items-center justify-between">
          <button type="reset" id="btn-reset" class="text-sm font-bold text-zinc-500 hover:text-goodang-black transition-colors uppercase tracking-wider">
            Reset
          </button>
          <button type="submit" class="bg-goodang-yellow text-goodang-black border-2 border-goodang-black font-display font-bold text-lg tracking-wider uppercase py-2 px-6 shadow-solid-yellow hover:bg-goodang-yellowHover hover:translate-x-1 hover:translate-y-1 hover:shadow-none transition-all">
            CLIP IN & PRINT
          </button>
        </div>
      </form>
    </div>
  </section>

  <section class="lg:col-span-7">
    <div class="flex items-center justify-between mb-6 pb-2 border-b-2 border-zinc-300">
      <h3 class="font-display font-bold text-2xl text-goodang-black uppercase tracking-wide">Gear <span class="text-zinc-500">Tags</span></h3>
      <span class="bg-goodang-black text-goodang-yellow text-xs font-bold py-1.5 px-4 uppercase tracking-widest">
        Total: <span id="count-badge">0</span>
      </span>
    </div>

    <div id="card-container" class="grid grid-cols-1 gap-8 place-items-center md:place-items-start">
      
      <div id="empty-state" class="w-full bg-zinc-200 border-2 border-dashed border-zinc-400 p-12 text-center text-zinc-500">
        <svg class="w-16 h-16 mx-auto mb-4 text-zinc-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"></path></svg>
        <p class="font-display font-bold text-xl text-zinc-600 mb-1 uppercase tracking-wide">NO GEAR TAGS YET</p>
        <p class="text-sm font-medium">Isi form di sebelah kiri untuk mencetak Access Tag Anda.</p>
      </div>
    </div>
  </section>
</main>

<div id="toast" class="fixed top-6 right-6 bg-goodang-black text-white text-sm font-bold py-4 px-6 border-l-4 border-goodang-yellow shadow-solid translate-x-full opacity-0 transition-all duration-300 z-[100] uppercase tracking-wide"></div>

<script src="script.js"></script>
</body>
</html>
